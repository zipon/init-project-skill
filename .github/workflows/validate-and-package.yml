name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and public links
        run: ./scripts/validate.sh --links
      - name: Build distribution archives
        run: ./scripts/package.sh
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: aws-cdk-project-init-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated archives
        uses: actions/download-artifact@v4
        with:
          name: aws-cdk-project-init-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "AWS CDK Project Init $GITHUB_REF_NAME"
